name: tests

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['8', '9', '10', '11', '12', '13']
        include:
          - { laravel: '8', testbench: '^6.48' }
          - { laravel: '9', testbench: '^7.58' }
          - { laravel: '10', testbench: '^8.39' }
          - { laravel: '11', testbench: '^9.18' }
          - { laravel: '12', testbench: '^10.12' }
          - { laravel: '13', testbench: '^11.3' }
        exclude:
          - { laravel: '13', php: '8.2' }

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite, intl
          coverage: none

      # Composer 2.9+ blocks versions with security advisories; every Laravel 8-11 release has one.
      - name: Allow Laravel versions with security advisories
        if: ${{ fromJSON(matrix.laravel) <= 11 }}
        run: composer config --json policy.advisories.block false

      - name: Install dependencies
        run: |
          composer remove --dev --no-update larastan/larastan nunomaduro/phpinsights onramplab/onr-phpcs-laravel phpmd/phpmd rector/rector squizlabs/php_codesniffer
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --prefer-dist

      - name: Assert installed Laravel version
        run: |
          composer show laravel/framework | grep -E "^versions : \* v${{ matrix.laravel }}\."

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, pdo_sqlite, intl
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Static analysis
        run: vendor/bin/phpstan --no-progress --memory-limit=1G

      - name: PHPCS
        run: tools/scripts/phpcs-all-files.sh

      - name: PHP Insights
        run: composer insights

      - name: Rector
        run: composer rector
        continue-on-error: true
